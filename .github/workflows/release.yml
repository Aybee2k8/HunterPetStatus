name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  package:
    name: Package and upload
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Uploads to CurseForge and Wago only if the matching secret is set, so
      # this workflow is useful for building a zip before either is configured.
      - name: Package
        uses: BigWigsMods/packager@master
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
