name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  package:
    name: Package and upload
    runs-on: ubuntu-latest

    env:
      # The packager's README names CF_API_TOKEN; the GitHub Action's own wiki
      # example names CF_API_KEY. The two disagree and it is not worth a failed
      # release to find out which wins, so both are set from the same secret.
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The TOC carries a literal version rather than the packager's
      # @project-version@ placeholder, so that a clone install shows a real
      # number. That can drift from the tag; this refuses the release if it has.
      - name: Tag matches the TOC version
        run: |
          toc="$(sed -n 's/^## Version: //p' PetWatch/PetWatch.toc | tr -d '\r')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$toc" != "$tag" ]; then
            echo "PetWatch.toc says '$toc' but the tag says '$tag'." >&2
            exit 1
          fi
          echo "version $toc"

      # Pinned to the v2 tag rather than master: an action that moves under you
      # turns a release into a debugging session.
      #
      # Uploading needs two things beyond the token: '## X-Curse-Project-ID' in
      # the TOC (and '## X-Wago-ID' for Wago), and the matching secret. Without
      # them the packager still builds the zip and attaches it to the GitHub
      # release, it just skips the upload — which is why this is useful before
      # either is configured.
      - name: Package
        uses: BigWigsMods/packager@v2
